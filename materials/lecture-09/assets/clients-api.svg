<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 480" role="img" aria-labelledby="title desc">
  <title id="title">Несколько клиентов одного API</title>
  <desc id="desc">Сайт, мобильное приложение, бот и Swagger UI обращаются к Delivery API, который использует данные службы доставки.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#788786"/></marker>
  </defs>
  <g fill="#eae7d6" stroke="#788786" stroke-width="3">
    <rect x="20" y="35" width="205" height="75" rx="12"/>
    <rect x="20" y="135" width="205" height="75" rx="12"/>
    <rect x="20" y="235" width="205" height="75" rx="12"/>
    <rect x="20" y="335" width="205" height="75" rx="12"/>
  </g>
  <g font-family="Manrope,Arial,sans-serif" font-size="28" font-weight="700" fill="#1f3433" text-anchor="middle">
    <text x="122" y="82">Сайт</text>
    <text x="122" y="182">Приложение</text>
    <text x="122" y="282">Бот</text>
    <text x="122" y="382">Swagger UI</text>
  </g>
  <g fill="none" stroke="#788786" stroke-width="4" marker-end="url(#arrow)">
    <path d="M 225 72 C 330 72, 338 215, 440 215"/>
    <path d="M 225 172 C 330 172, 340 225, 440 225"/>
    <path d="M 225 272 C 330 272, 340 235, 440 235"/>
    <path d="M 225 372 C 330 372, 338 245, 440 245"/>
  </g>
  <rect x="450" y="165" width="330" height="145" rx="18" fill="#bdd3ba" stroke="#788786" stroke-width="3"/>
  <text x="615" y="229" font-family="Manrope,Arial,sans-serif" font-size="42" font-weight="700" fill="#1f3433" text-anchor="middle">Delivery API</text>
  <text x="615" y="270" font-family="Manrope,Arial,sans-serif" font-size="23" fill="#365654" text-anchor="middle">общие правила обмена</text>
  <path d="M 782 237 H 900" fill="none" stroke="#788786" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="910" y="185" width="190" height="105" rx="18" fill="#eae7d6" stroke="#788786" stroke-width="3"/>
  <text x="1005" y="230" font-family="Manrope,Arial,sans-serif" font-size="27" font-weight="700" fill="#1f3433" text-anchor="middle">Данные</text>
  <text x="1005" y="265" font-family="Manrope,Arial,sans-serif" font-size="21" fill="#365654" text-anchor="middle">о посылках</text>
</svg>
