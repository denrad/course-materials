<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 620" role="img" aria-labelledby="title desc">
  <title id="title">Условная форма добавления книги</title>
  <desc id="desc">Форма содержит название, автора, необязательный выбор файла обложки и кнопку «Добавить».</desc>
  <rect width="760" height="620" fill="none"/>
  <rect x="38" y="30" width="684" height="554" rx="12" fill="#EAE7D6" stroke="#788786" stroke-width="4"/>
  <rect x="38" y="30" width="684" height="82" rx="12" fill="#BDD3BA"/>
  <path d="M38 112H722" stroke="#788786" stroke-width="3"/>
  <g fill="#1F3433" font-family="Manrope,Arial,sans-serif">
    <text x="76" y="84" font-size="35" font-weight="700">Добавить книгу</text>
    <text x="76" y="167" font-size="23" font-weight="600">Название</text>
    <text x="76" y="270" font-size="23" font-weight="600">Автор</text>
    <text x="76" y="373" font-size="23" font-weight="600">Обложка</text>
  </g>
  <g fill="#EEF4F4" stroke="#AEB6B6" stroke-width="3">
    <rect x="76" y="183" width="606" height="65" rx="6"/>
    <rect x="76" y="286" width="606" height="65" rx="6"/>
    <rect x="76" y="389" width="606" height="65" rx="6"/>
  </g>
  <g fill="#5F7473" font-family="Manrope,Arial,sans-serif" font-size="24">
    <text x="96" y="225">Название книги</text>
    <text x="96" y="328">Имя автора</text>
    <text x="96" y="431">Выбрать изображение…</text>
  </g>
  <rect x="400" y="492" width="282" height="67" rx="7" fill="#A7BDC0" stroke="#788786" stroke-width="3"/>
  <text x="541" y="535" fill="#1F3433" font-family="Manrope,Arial,sans-serif" font-size="28" font-weight="700" text-anchor="middle">Добавить</text>
</svg>
