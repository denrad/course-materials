<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 520" role="img" aria-labelledby="title desc">
  <title id="title">Локальный и удалённый Git-репозитории</title>
  <desc id="desc">Локальный репозиторий содержит коммиты A, B, C. После push удалённый репозиторий тоже содержит A, B, C.</desc>
  <rect width="1280" height="520" fill="none"/>
  <rect x="72" y="102" width="415" height="320" rx="10" fill="#EAE7D6" stroke="#788786" stroke-width="4"/>
  <rect x="790" y="102" width="415" height="320" rx="10" fill="#BDD3BA" stroke="#788786" stroke-width="4"/>
  <g fill="#1F3433" font-family="Manrope,Arial,sans-serif" text-anchor="middle">
    <text x="280" y="172" font-size="34" font-weight="700">Локально</text>
    <text x="997" y="172" font-size="34" font-weight="700">Удалённо</text>
    <text x="280" y="365" font-size="27">можно работать без сети</text>
    <text x="997" y="365" font-size="27">доступно команде</text>
    <text x="640" y="242" font-size="36" font-weight="700">push</text>
  </g>
  <g stroke="#788786" stroke-width="5" fill="#EEF4F4">
    <circle cx="165" cy="257" r="34"/><circle cx="280" cy="257" r="34"/><circle cx="395" cy="257" r="34"/>
    <circle cx="882" cy="257" r="34"/><circle cx="997" cy="257" r="34"/><circle cx="1112" cy="257" r="34"/>
  </g>
  <g fill="#1F3433" font-family="Manrope,Arial,sans-serif" font-size="27" font-weight="700" text-anchor="middle">
    <text x="165" y="267">A</text><text x="280" y="267">B</text><text x="395" y="267">C</text>
    <text x="882" y="267">A</text><text x="997" y="267">B</text><text x="1112" y="267">C</text>
  </g>
  <path d="M516 280H747" stroke="#788786" stroke-width="7" fill="none" stroke-linecap="round"/>
  <path d="M725 260l26 20-26 20" stroke="#788786" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
